  /v2/klines:
    get:
      tags:
        - Klines
      summary: Kline / Candlestick Data
      description: |
        Returns candlestick (OHLCV) bars for a symbol.

        Data is assembled from a cold store (PostgreSQL) and a hot store (Redis).
        Missing candles between data points are gap-filled with the previous close price and zero volume.

        ### Price types

        | `priceType` | Description |
        |-------------|-------------|
        | `last`      | Last traded price (default). |
        | `mark`      | Mark price — volume is overlaid from `last` klines. |
        | `index`     | Index price — volume is overlaid from `last` klines. |

        ### Response format

        Each element is a JSON array (Binance-compatible):

        | Index | Field           | Type   |
        |-------|-----------------|--------|
        | 0     | openTime        | int64  |
        | 1     | open            | string |
        | 2     | high            | string |
        | 3     | low             | string |
        | 4     | close           | string |
        | 5     | volume          | string |
        | 6     | closeTime       | int64  |
        | 7     | quoteVolume     | string |
        | 8     | trades          | int64  |
        | 9     | takerBuyBase    | string |
        | 10    | takerBuyQuote   | string |
        | 11    | (unused)        | string |

        ### Caching

        Responses are cached server-side for **5 seconds** (short-TTL).
        The `X-Cache` response header indicates `HIT` or `MISS`.
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
          example: BTC-USDT
          description: Trading pair symbol.
          x-gitbook-description-html: <p>Trading pair symbol.</p>
        - name: interval
          in: query
          required: true
          schema:
            type: string
            enum:
              - 1m
              - 3m
              - 5m
              - 15m
              - 30m
              - 1h
              - 2h
              - 4h
              - 6h
              - 8h
              - 12h
              - 1d
              - 3d
              - 1w
              - 1M
          description: Kline interval.
          x-gitbook-description-html: <p>Kline interval.</p>
        - name: startTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Start time in Unix milliseconds (inclusive). Omit to let the server choose.
          x-gitbook-description-html: <p>Start time in Unix milliseconds (inclusive). Omit to let the server choose.</p>
        - name: endTime
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: End time in Unix milliseconds (inclusive). Omit to return up to the latest candle.
          x-gitbook-description-html: <p>End time in Unix milliseconds (inclusive). Omit to return up to the latest candle.</p>
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1500
            default: 500
          description: Maximum number of candles to return. Clamped to 1500.
          x-gitbook-description-html: <p>Maximum number of candles to return. Clamped to 1500.</p>
        - name: priceType
          in: query
          required: false
          schema:
            type: string
            enum:
              - last
              - mark
              - index
            default: last
          description: |
            Price series to use.
