      x-gitbook-description-html: >-
        <p>Returns a snapshot of the current order book for a given
        symbol.</p><h3>Field
        semantics</h3><table><thead><tr><th>Field</th><th>Type</th><th>Description</th></tr></thead><tbody><tr><td><code>lastUpdateId</code></td><td>uint64</td><td>Monotonically
        increasing sequence ID assigned by the matching engine
        (<code>ctx.SequenceID</code>). This is a <strong>real update
        ID</strong>, not a placeholder or
        timestamp.</td></tr><tr><td><code>E</code></td><td>int64</td><td>Snapshot
        event time — Unix milliseconds when the matching engine produced the
        snapshot.</td></tr><tr><td><code>T</code></td><td>int64</td><td>Transaction
        time — same value as <code>E</code> for this endpoint. Represents when
        the orderbook state was captured, <strong>not</strong> the server
        response
        time.</td></tr><tr><td><code>bids</code></td><td>string[][]</td><td>Bid
        levels sorted best (highest) first. Each entry is <code>[price,
        quantity]</code>.</td></tr><tr><td><code>asks</code></td><td>string[][]</td><td>Ask
        levels sorted best (lowest) first. Each entry is <code>[price,
        quantity]</code>.</td></tr></tbody></table><h3>Synchronising a local
        order book with WebSocket</h3><ol><li><strong>Initialise</strong> —
        fetch this endpoint and record
        <code>lastUpdateId</code>.</li><li><strong>Connect</strong> to the
        WebSocket stream
        <code>{symbol}@depth</code>.</li><li><strong>Drop</strong> any WS
        <code>depthUpdate</code> event where <code>u &#x3C;=
        lastUpdateId</code>.</li><li><strong>Apply</strong> all subsequent
        events to update your local
        book.</li></ol><blockquote><p><strong>Important:</strong> per-symbol
        <code>+1</code> continuity between consecutive <code>u</code> values is
        <strong>not</strong> guaranteed — the engine may skip IDs when no book
        change occurs. Do <strong>not</strong> treat a gap as a missed
        update.</p></blockquote><h3>JS / TS
        consumers</h3><p><code>lastUpdateId</code> (and the WS fields
        <code>U</code> / <code>u</code>) can exceed
        <code>Number.MAX_SAFE_INTEGER</code>. Always parse them with a
        BigInt-safe method:</p><pre class="language-ts"><code class="lang-ts">//
        When parsing the REST response

        const data = JSON.parse(text, (key, value) => {
          if (key === "lastUpdateId") return BigInt(value);
          return value;
        });


        // When parsing WS depthUpdate messages

        const msg = JSON.parse(text, (key, value) => {
          if (key === "U" || key === "u") return BigInt(value);
          return value;
        });

        </code></pre><h3>Caching</h3><p>Responses are cached server-side for
        <strong>5 seconds</strong> (short-TTL). The <code>X-Cache</code>
        response header indicates <code>HIT</code> or <code>MISS</code>.</p>
