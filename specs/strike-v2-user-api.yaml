  /v2/history/transaction:
    get:
      tags:
      - History
      summary: Get transaction history
      description: Returns deposits, withdrawals, fees, realized PnL, liquidations, funding, rewards, credit, and
        internal transfers for the resolved account, newest first. Public account selectors do not require authentication;
        sub_account_id and the no-selector caller context do. Selector precedence is account_id, vault_id, blockchain
        address, then authenticated caller/subaccount.
      parameters:
      - name: type
        in: query
        required: false
        description: Filter by transaction type. Accepts repeated parameters or comma-separated integers/strings.
          1=deposit, 2=withdraw, 3=fee, 4=realized_pnl, 5=liquidation, 6=funding, 7=reward_grant, 8=reward_reclaim,
          9=credit, 10=transfer.
        schema:
          type: string
        example: 1,2
      - name: status
        in: query
        required: false
        description: 'Filter by status (integer enum): `1` = pending, `2` = completed, `3` = pending_settlement,
          `4` = settled, `5` = failed, `6` = cancelled

          '
        schema:
          type: integer
      - name: startTime
        in: query
        required: false
        description: Start time filter (Unix ms)
        schema:
          type: integer
          format: int64
      - name: endTime
        in: query
        required: false
        description: End time filter (Unix ms)
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        description: Maximum number of results. Clamped to 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: fromId
        in: query
        required: false
        description: 'Backward cursor: return rows with ID less than this value, newest first.'
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/AccountID'
      - $ref: '#/components/parameters/SubAccountID'
      - $ref: '#/components/parameters/VaultID'
      - $ref: '#/components/parameters/Blockchain'
      - $ref: '#/components/parameters/BlockchainAddress'
      responses:
        '200':
          description: Transaction history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/InvalidParameter'
      operationId: getTransactionHistory
      security:
      - {}
      - ApiWalletAuth: []
        ApiWalletSignature: []
        ApiWalletTimestamp: []
        ApiWalletNonce: []
      - BearerAuth: []
  /v2/sub-accounts:
    get:
      tags:
      - Subaccounts
      summary: List subaccounts
      description: Lists the authenticated master account's pending and active subaccounts, including current equity,
        available balance, PnL, and margin-used percentage. API-wallet traders can use the returned account_id as
        sub_account_id on supported trading and read endpoints.
      operationId: listSubAccounts
      security:
      - ApiWalletAuth: []
        ApiWalletSignature: []
        ApiWalletTimestamp: []
        ApiWalletNonce: []
      responses:
        '200':
          description: Subaccounts owned by the authenticated master account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubAccountsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
