  /v1/stats/account/{account_id}:
    get:
      tags:
        - Account Statistics
      summary: Account Statistics
      description: |
        Returns comprehensive per-account statistics including PnL across
        multiple time windows, volume, fees, and liquidation totals.
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
          description: The account ID.
          x-gitbook-description-html: <p>The account ID.</p>
      responses:
        "200":
          description: Account statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStats"
              example:
                account_id: 0x123abc...
                address: 0x456def...
                account_value: "1000000.50"
                realized_pnl:
                  24h: "15000.00"
                  7d: "35000.00"
                  30d: "85000.00"
                  all_time: "250000.00"
                unrealized_pnl: "50000.00"
                volume:
                  24h: "500000.00"
                  7d: "2500000.00"
                  30d: "8000000.00"
                  all_time: "25000000.00"
                trading_fees: "125000.00"
                funding_fees: "-50000.00"
                liquidations: "10000.00"
          x-gitbook-description-html: <p>Account statistics</p>
        "400":
          description: Missing account_id
          content:
            application/json:
              example:
                error: account_id is required
          x-gitbook-description-html: <p>Missing account_id</p>
      x-gitbook-description-html: >-
