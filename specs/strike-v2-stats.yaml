        counted dynamically from funding payment timestamps.

        Cached server-side (default 3 minutes).
      responses:
        "200":
          description: Annualized funding rate series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompactSeriesWrapper"
              example:
                annualized_funding_rate:
