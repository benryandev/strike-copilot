paths:
  /v1/dashboard/summary:
    get:
      tags:
        - Platform Dashboard
      summary: Platform Summary
      description: |
        Returns high-level platform metrics: total users, volume, deposits,
        withdrawals, liquidations, revenue, and current open interest.

        Cached server-side (default 3 minutes).
      responses:
        "200":
          description: Platform summary metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSummary"
              example:
                total_users: 12345
                total_volume_usd: "1234567890.50"
                total_deposits_usd: "9876543.21"
                total_withdrawals_usd: "5432100.00"
                total_liquidated_usd: "123456.78"
                total_revenue_usd: "654321.99"
                open_interest_usd: "5000000.00"
          x-gitbook-description-html: <p>Platform summary metrics</p>
      x-gitbook-description-html: >-
        <p>Returns high-level platform metrics: total users, volume, deposits,
        withdrawals, liquidations, revenue, and current open
        interest.</p><p>Cached server-side (default 3 minutes).</p>
