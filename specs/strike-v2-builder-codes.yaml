components:
  securitySchemes:
    ApiWalletAuth:
      type: apiKey
      in: header
      name: X-API-Wallet-Public-Key
      description: >
        API wallet authentication uses four headers together:
        `X-API-Wallet-Public-Key`, `X-API-Wallet-Signature`,
        `X-API-Wallet-Timestamp`, and `X-API-Wallet-Nonce`. The signature
        message format is `{METHOD}:{PATH}:{TIMESTAMP}:{NONCE}:{BODY_HASH}`
        where BODY_HASH is the SHA-256 hex digest of the JSON body (or empty
        string for GET). The message is signed with the Ed25519 private key
        corresponding to the public key.
      x-gitbook-description-html: >-
        <p>API wallet authentication uses four headers together:
        <code>X-API-Wallet-Public-Key</code>,
        <code>X-API-Wallet-Signature</code>,
