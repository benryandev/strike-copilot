                    window_seconds: 3600
                    limit: '1000000'
                    used: '25000'
                    remaining: '975000'
                    current_used: '25000'
                    previous_used: '0'
                    window_start: 1711972800
                  per_asset_24h:
                    window_seconds: 86400
                    limit: '5000000'
                    used: '25000'
                    remaining: '4975000'
                    current_used: '25000'
                    previous_used: '0'
                    window_start: 1711929600
                  global_1h:
                    window_seconds: 3600
                    limit: '2000000'
                    used: '25000'
                    remaining: '1975000'
                    current_used: '25000'
                    previous_used: '0'
                    window_start: 1711972800
                  global_24h:
                    window_seconds: 86400
                    limit: '10000000'
                    used: '25000'
                    remaining: '9975000'
                    current_used: '25000'
                    previous_used: '0'
