      x-gitbook-description-html: >-
        <p>Returns current withdrawal rate-limit buckets and queue state for a
        blockchain + asset pair. Use this shared endpoint for supported chains;
        there is no Cardano-only limits endpoint.</p><p><code>chain</code> is
        the documented query parameter. The API also accepts
        <code>blockchain</code> as an alias.</p><p>In the Builder Codes flow,
        this endpoint is called with the builder API wallet credentials and
        returns limits for the connected user account behind that API
        wallet.</p><h3>Why use this endpoint</h3><p>Use
        withdraw limits before creating a quote when you want to:</p><ul><li>Show
        the user how much of an asset can be withdrawn right now.</li><li>Disable
        or warn on an amount that would exceed the per-asset or global 1h/24h
        limits.</li><li>Explain why a quote may fail with
        <code>withdrawal rate limit reached</code> or
        <code>withdrawal amount exceeds maximum single-withdrawal
        limit</code>.</li><li>Show whether withdrawals are already queued and
        estimate how long the queue may take to drain.</li><li>Warn that a large
        withdrawal may enter an additional delayed queue.</li></ul><p>Example:
        before asking the user to sign a 1,200 ADA withdrawal, call
        <code>GET /v2/withdraw/limits?chain=cardano&amp;asset=ADA</code>. If
        <code>remaining</code> is <code>975</code> or the amount is above
        <code>large_withdrawal.threshold</code>, the UI can lower the suggested
        amount, split the withdrawal, or show an expected delay before the wallet
        signature step.</p><h3>Authentication</h3><p>Requires
        API wallet authentication via headers.</p>
  /v2/withdraw/queue-position:
    get:
      tags:
        - Withdraw
      summary: Get Withdrawal Queue Position
      description: |
        Returns the current retry/settlement queue position for a withdrawal.
        Use this shared endpoint for supported chains; there is no Cardano-only
        queue-position endpoint.

        `withdrawal_id` and `chain` are the documented query parameters. The
        API also accepts `withdraw_id` and `blockchain` as aliases.

        In the Builder Codes flow, this endpoint is called with the builder
        API wallet credentials and can only inspect withdrawals for the
        connected user account behind that API wallet.

        ### Why use this endpoint

        Use queue position after a withdrawal has been submitted and you have a
        `withdrawal_id`. This endpoint is for status and ETA messaging, not for
        creating or retrying a withdrawal.

        Common examples:

        - Show a user why a confirmed withdrawal is still pending instead of
          asking them to submit it again.
        - Display `wait_seconds`, `estimated_at`, or `retry_at` when a
          withdrawal is waiting behind rate limits or a chain-specific queue.
        - Distinguish a withdrawal that is not queued (`queued: false`,
          `status: not_deferred`) from one that is delayed.
        - Provide support/debug context with `retry_reason`,
          `transaction_status`, or `queue_tx_hash` when present.

        Example: after `POST /v2/withdraw` returns `request_id:
        def-cardano-456`, call
        `GET /v2/withdraw/queue-position?chain=cardano&withdrawal_id=def-cardano-456`.
        If the response has `queued: true` and `wait_seconds: 300`, show that
        the withdrawal is queued and expected to retry in about five minutes.

        ### Authentication

        Requires API wallet authentication via headers.
      security:
        - ApiWalletAuth: []
      parameters:
        - name: withdrawal_id
          in: query
          required: true
          schema:
            type: string
          description: Withdrawal ID returned by the quote/confirm flow.
        - name: chain
          in: query
          required: true
          schema:
            type: string
            enum:
              - ethereum
              - cardano
          description: Blockchain to inspect. `blockchain` is accepted as an alias.
      responses:
        '200':
          description: Queue position returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawQueuePositionResponse'
              examples:
                queued:
                  summary: Queued withdrawal
                  value:
                    withdrawal_id: def-cardano-456
                    queued: true
                    status: queued
                    queue_status: rate_limited
                    transaction_status: pending
                    blockchain: cardano
                    wait_seconds: 300
                    estimated_at: 1711973100
                    retry_at: 1711973100
                    retry_reason: rate_limit
                not_queued:
                  summary: Not queued
                  value:
                    withdrawal_id: def-456
                    queued: false
                    status: not_deferred
                    blockchain: ethereum
                    wait_seconds: 0
          x-gitbook-description-html: <p>Queue position returned</p>
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          x-gitbook-description-html: <p>Invalid request</p>
        '401':
          description: API wallet authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          x-gitbook-description-html: <p>API wallet authentication failed</p>
        '404':
          description: Withdrawal not found or not owned by the authenticated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          x-gitbook-description-html: <p>Withdrawal not found or not owned by the authenticated account</p>
        '501':
          description: Queue position is not implemented for this blockchain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          x-gitbook-description-html: <p>Queue position is not implemented for this blockchain</p>
        '503':
          description: Withdrawal service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          x-gitbook-description-html: <p>Withdrawal service unavailable</p>
