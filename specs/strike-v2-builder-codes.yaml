  /v2/deposit/build-tx:
    post:
      tags:
        - Deposit
      summary: Build Unsigned Transaction
      description: >
        Builds an unsigned transaction for the deposit. The transaction is

        constructed entirely by the backend — destination address, amount,

        and contract call data are all server-controlled.


        The builder passes the unsigned transaction to the user's wallet

        (Phantom, Rabby, Nami) for signing. The wallet displays the actual

        destination and amount so the user can verify before signing.


        ### Response format by chain


        | Chain | `format` field | `unsigned_tx` type |

        |-------|----------------|-------------------|

        | Ethereum | `evm_tx_params` | JSON object (`from`, `to`, `data`,
        `value`, `gas`) |

        | Solana | `solana_base64` | Base64-encoded transaction |

        | Cardano | `cardano_cbor` | CBOR hex-encoded transaction |


        ### Authentication


        Requires API wallet authentication via headers.
      security:
        - ApiWalletAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildTxRequest'
            example:
              request_id: abc-123
              user_address: 9WzDXwBhzVFT...
      responses:
        '200':
          description: Unsigned transaction built
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BuildTxResponseEVM'
                  - $ref: '#/components/schemas/BuildTxResponseSolana'
                  - $ref: '#/components/schemas/BuildTxResponseCardano'
              examples:
                evm:
                  summary: Ethereum / EVM
                  value:
                    blockchain: ethereum
                    unsigned_tx:
                      from: 0xUserAddr...
                      to: 0xStrikeDeposit...
                      data: 0xa9059cbb...
                      value: '0x0'
                      gas: 0x...
                    format: evm_tx_params
                    approval_tx:
                      from: 0xUserAddr...
                      to: 0xTokenContract...
                      data: 0x095ea7b3...
                      value: '0x0'
                      gas: 0x...
                solana:
                  summary: Solana
                  value:
                    blockchain: solana
                    unsigned_tx: AQAAAA...
                    format: solana_base64
                    expires_at: 1711900060000
                cardano:
                  summary: Cardano
                  value:
                    blockchain: cardano
                    unsigned_tx: 84a400...
                    format: cardano_cbor
                    expires_at: 1711900900000
          x-gitbook-description-html: <p>Unsigned transaction built</p>
        '400':
          description: Invalid request or expired quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          x-gitbook-description-html: <p>Invalid request or expired quote</p>
        '401':
          description: API wallet authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          x-gitbook-description-html: <p>API wallet authentication failed</p>
        '403':
          description: Access denied (account mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          x-gitbook-description-html: <p>Access denied (account mismatch)</p>
        '404':
