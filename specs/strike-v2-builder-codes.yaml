openapi: 3.0.3
info:
  title: Strike Builder API
  description: |
    User-facing endpoints for the Builder Codes integration flow.
    Includes wallet-signature authentication, deposit, and withdrawal flows.
    Base path: `/v2` (deposit/withdraw) and `/auth` (connect flow)
  version: 2.0.0
  contact:
    name: Strike Finance
    url: https://www.strikefinance.org
  x-gitbook-description-document:
    object: document
    data:
      schemaVersion: 9
    nodes:
      - object: block
        type: paragraph
        isVoid: false
        data: {}
        nodes:
          - object: text
            leaves:
              - object: leaf
                text: >-
                  User-facing endpoints for the Builder Codes integration flow.
                  Includes wallet-signature authentication, deposit, and
                  withdrawal flows. Base path: 
                marks: []
              - object: leaf
                text: /v2
                marks:
                  - object: mark
                    type: code
                    data: {}
              - object: leaf
                text: ' (deposit/withdraw) and '
                marks: []
              - object: leaf
                text: /auth
                marks:
                  - object: mark
                    type: code
                    data: {}
              - object: leaf
                text: ' (connect flow)'
                marks: []
            key: a6ALilgO3CAL
        key: YIffJ9ynjT9m
    key: DKIhKmQEEBLn
  x-gitbook-description-html: >-
    <p>User-facing endpoints for the Builder Codes integration flow. Includes
    wallet-signature authentication, deposit, and withdrawal flows. Base path:
    <code>/v2</code> (deposit/withdraw) and <code>/auth</code> (connect
    flow)</p>
servers:
  - url: https://api.strikefinance.org
    description: Mainnet
    x-gitbook-description-html: <p>Mainnet</p>
  - url: https://api-v2-testnet.strikefinance.org
    description: Testnet
    x-gitbook-description-html: <p>Testnet</p>
tags:
  - name: Builder Connect
    description: >-
      Public wallet-signature flow that connects a user to a builder. No JWT or
      prior Strike account required — new users are created automatically.
    x-gitbook-description-document:
      object: document
      data:
        schemaVersion: 9
      nodes:
        - object: block
          type: paragraph
          isVoid: false
          data: {}
          nodes:
            - object: text
              leaves:
                - object: leaf
                  text: >-
                    Public wallet-signature flow that connects a user to a
                    builder. No JWT or prior Strike account required — new users
                    are created automatically.
                  marks: []
              key: hYEx7gFJgEeP
          key: 7zfB09VtsCU8
      key: Pt1YZCkQOT83
    x-gitbook-description-html: >-
      <p>Public wallet-signature flow that connects a user to a builder. No JWT
      or prior Strike account required — new users are created
      automatically.</p>
  - name: Deposit
    description: >-
      Three-step deposit flow: quote → build unsigned transaction → confirm with
      tx hash. The user's wallet signs the on-chain transaction. The builder
      cannot redirect funds — the deposit address is Strike's vault address,
      hardcoded in backend config.
    x-gitbook-description-document:
      object: document
      data:
        schemaVersion: 9
      nodes:
        - object: block
          type: paragraph
          isVoid: false
          data: {}
          nodes:
            - object: text
              leaves:
                - object: leaf
                  text: >-
                    Three-step deposit flow: quote → build unsigned transaction
                    → confirm with tx hash. The user's wallet signs the on-chain
                    transaction. The builder cannot redirect funds — the deposit
                    address is Strike's vault address, hardcoded in backend
                    config.
                  marks: []
              key: wGmpGsqroORu
          key: 86jGUq6tRt5M
      key: INjYJ9dQkB02
    x-gitbook-description-html: >-
      <p>Three-step deposit flow: quote → build unsigned transaction → confirm
      with tx hash. The user's wallet signs the on-chain transaction. The
      builder cannot redirect funds — the deposit address is Strike's vault
      address, hardcoded in backend config.</p>
  - name: Withdraw
    description: >-
      Shared withdrawal flow for Ethereum, Solana, and Cardano: quote → confirm
      with wallet signature. There are no Cardano-only public withdrawal
      endpoints; set `blockchain: cardano` on the shared endpoints. Cardano
      quotes may include funding transaction fields that must be signed and
      returned during confirmation. The backend automatically uses the account's
      registered wallet address as the recipient. For Builder Codes, these
      endpoints are called with the API wallet created by the Builder Connect
      flow and are scoped to that connected user account. The builder cannot
      redirect withdrawals or withdraw without the user's wallet signature.
