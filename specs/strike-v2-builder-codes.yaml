                    account's registered wallet address as the recipient. For
                    Builder Codes, these endpoints are called with the API
                    wallet created by the Builder Connect flow and are scoped to
                    that connected user account. The builder cannot redirect
                    withdrawals or withdraw without the user's wallet signature.
                  marks: []
              key: CGXEeRDKdloO
