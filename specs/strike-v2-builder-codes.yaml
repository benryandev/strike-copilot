  /auth/builder/verify-signature:
    post:
      tags:
        - Builder Connect
      summary: Verify Signature
      description: |
        Verifies the user's wallet signature against the challenge message
        and completes the builder connect flow.

        On success, the backend:
        1. Creates a new Strike account if the user doesn't have one
        2. Applies the validated referral when one was requested and the user
           does not already have a referrer
        3. Approves the builder for this account (idempotent)
        4. Revokes any existing API wallets for this account + builder code
        5. Creates a new API wallet linked to the builder code

        The nonce is single-use (`GETDEL` in Redis) — replaying the same
        nonce returns a 400 error.

        ### Signature verification

        - **Ethereum:** EIP-191 personal sign
        - **Solana:** Ed25519 signature over raw message bytes
        - **Cardano:** CIP-30 data sign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySignatureRequest'
            example:
              nonce: 019d4a2b-3c4d-5e6f-7a8b-9c0d1e2f3a4b
              wallet_signature: 0xabc123def456...
      responses:
        '200':
          description: >-
            Builder connected successfully. Returns the account ID, builder
            code, approved fee cap, referral result, and the newly created API
            wallet details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifySignatureResponse'
              example:
                account_id: 019d4a2b-1111-2222-3333-444455556666
                nickname: ''
                avatar_url: ''
                builder_code: minswap
                fee_share_bps: 50
                api_wallet_id: 42
                api_wallet_public_key: >-
                  a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
                api_wallet_expired_at: '2026-04-01T12:00:00Z'
                referral:
                  status: accepted
                  code: MINDSWAP
          x-gitbook-description-html: >-
            <p>Builder connected successfully. Returns the account ID, builder
            code, approved fee cap, referral result, and the newly created API
            wallet details.</p>
        '400':
          description: Validation or verification error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expired_nonce:
                  summary: Nonce expired or already used
                  value:
                    error: challenge not found or expired
                mismatch:
                  summary: Address/chain mismatch
                  value:
                    error: address or chain does not match challenge
          x-gitbook-description-html: <p>Validation or verification error</p>
        '401':
          description: Signature verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: wallet signature verification failed
          x-gitbook-description-html: <p>Signature verification failed</p>
