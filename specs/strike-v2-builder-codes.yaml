                  value:
                    error: chain must be ethereum, solana, or cardano
                invalid_pubkey:
                  summary: Invalid public key
                  value:
                    error: 'invalid public key: must be 64 hex characters (Ed25519)'
                invalid_fee:
                  summary: Fee out of range
                  value:
                    error: fee_share_bps must be 0-100
                inactive_builder:
                  summary: Builder is deactivated
                  value:
                    error: builder is not active
                referral_not_owned:
                  summary: Referral does not belong to builder
                  value:
                    error: referral code does not belong to the builder
          x-gitbook-description-html: <p>Validation error</p>
        '404':
          description: Builder not found
