  /auth/builder/request-signature:
    post:
      tags:
        - Builder Connect
      summary: Request Signature Challenge
      description: |
        Returns a challenge message for the user to sign in their wallet
        (Phantom, Rabby, Nami). This is the first step of the builder
        connect flow.

        The dApp generates an Ed25519 keypair client-side, then sends
        the public key along with the user's wallet address, chain,
        builder code, fee approval, and an optional referral code.

        When `referral_code` is supplied, referral attribution is opt-in.
        The code must be the canonical or customized referral code owned by
        the account that owns the builder code. Omit it to connect without
        accepting a referral.

        ### Validation

        - `chain` must be `ethereum`, `solana`, or `cardano`
        - `public_key` must be exactly 64 hex characters (Ed25519)
        - `code` must reference an existing, active builder
        - `fee_share_bps` must be between 0 and 100
        - Optional `referral_code` must belong to the builder-code owner

        The returned `nonce` expires after 5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestSignatureRequest'
            example:
              address: 9WzDXwBhzVFT...
              chain: solana
              code: minswap
              fee_share_bps: 50
              public_key: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
              referral_code: MINDSWAP
      responses:
        '200':
          description: Signature challenge created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestSignatureResponse'
              example:
                nonce: 019d4a2b-3c4d-5e6f-7a8b-9c0d1e2f3a4b
                message_to_sign: |-
                  Connect to Strike via builder "minswap".
                  This authorizes the builder to collect up to 0.5% fee on your trades.
                  Referral attribution: builder "minswap" will be recorded as your permanent referrer if you do not already have one.
                  Referral code: MINDSWAP.
                  By signing, you are entrusting your API wallet private key to this builder. You trust the builder to store and use this key responsibly.
                  Wallet: 9WzDXwBhzVFT...
                  Chain: solana
                  API Key: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
                  Nonce: 019d4a2b-3c4d-5e6f-7a8b-9c0d1e2f3a4b
                  Timestamp: 2026-04-01T12:00:00Z

                  Complete verify-signature within 5 minutes; after that the challenge expires.
                message: |-
                  Connect to Strike via builder "minswap".
                  This authorizes the builder to collect up to 0.5% fee on your trades.
                  Referral attribution: builder "minswap" will be recorded as your permanent referrer if you do not already have one.
                  Referral code: MINDSWAP.
                  By signing, you are entrusting your API wallet private key to this builder. You trust the builder to store and use this key responsibly.
                  Wallet: 9WzDXwBhzVFT...
                  Chain: solana
                  API Key: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
                  Nonce: 019d4a2b-3c4d-5e6f-7a8b-9c0d1e2f3a4b
