      Cardano quotes may include funding transaction fields that must be signed
      and returned during confirmation. The backend automatically uses the
      account's registered wallet address as the recipient. For Builder Codes,
      these endpoints are called with the API wallet created by the Builder
      Connect flow and are scoped to that connected user account. The builder
