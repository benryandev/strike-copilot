  /v2/grid/bot:
    post:
      tags:
        - Grid
      summary: Create grid bot
      description: >
        Create a new grid trading bot. The API validates the request, publishes
        a create command to the grid service, and returns once the command is
        accepted. The grid service places and manages the child orders
        asynchronously.


        **Constraints:**

        - `upper_price` must be greater than `lower_price`

        - `grid_count`: 2 to 200

        - `collateral` must be positive and available in the account balance

        - Current mark price must be inside the grid range

        - LONG mode supports `sl_price` below `lower_price`

        - SHORT mode supports `sl_price` above `upper_price`

        - NEUTRAL mode supports `long_sl_price` below `lower_price` and/or
        `short_sl_price` above `upper_price`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGridBotRequest'
            examples:
              long_grid:
