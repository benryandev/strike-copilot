security:
  - ApiWalletAuth: []
    ApiWalletSignature: []
    ApiWalletTimestamp: []
    ApiWalletNonce: []
  - BearerAuth: []
components:
  securitySchemes:
    ApiWalletAuth:
      type: apiKey
      in: header
      name: X-API-Wallet-Public-Key
      description: Ed25519 API-wallet public key (64 hex characters).
    ApiWalletSignature:
      type: apiKey
      in: header
      name: X-API-Wallet-Signature
      description: Ed25519 signature (128 hex characters) over {METHOD}:{PATH_WITH_QUERY}:{TIMESTAMP}:{NONCE}:{SHA256_BODY_HEX}.
    ApiWalletTimestamp:
      type: apiKey
      in: header
      name: X-API-Wallet-Timestamp
      description: Unix timestamp in seconds. It must not be in the future or older than three minutes.
    ApiWalletNonce:
      type: apiKey
      in: header
      name: X-API-Wallet-Nonce
      description: Unique, single-use nonce between 16 and 128 characters.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Account JWT returned by the authentication flow.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
          x-gitbook-description-html: <p>Error message</p>
        code:
          type: string
          description: Error code
          x-gitbook-description-html: <p>Error code</p>
        msg:
          type: string
          description: Error message (alternative format)
          x-gitbook-description-html: <p>Error message (alternative format)</p>
      required:
        - error
    CreateOrderRequest:
      type: object
      required:
        - symbol
        - side
        - type
        - size
      properties:
        client_order_id:
          type: string
          description: Client-provided order ID for tracking
          example: my-order-001
          x-gitbook-description-html: <p>Client-provided order ID for tracking</p>
        symbol:
          type: string
          description: Trading pair symbol
          example: BTC-USD
          x-gitbook-description-html: <p>Trading pair symbol</p>
        side:
          type: string
          enum:
            - buy
            - sell
          description: Order side
          example: buy
          x-gitbook-description-html: <p>Order side</p>
        type:
          type: string
          enum:
            - limit
            - market
            - stop
            - stop_limit
            - take_profit
            - take_profit_limit
            - trailing_stop_market
          description: Order type
          example: limit
          x-gitbook-description-html: <p>Order type</p>
        size:
          type: string
          description: Order size in base asset
          example: '0.1'
          x-gitbook-description-html: <p>Order size in base asset</p>
        price:
          type: string
          description: Order price (required for limit orders)
          example: '50000.00'
          x-gitbook-description-html: <p>Order price (required for limit orders)</p>
        stop_price:
          type: string
          description: Trigger price for conditional orders
          example: '49500.00'
          x-gitbook-description-html: <p>Trigger price for conditional orders</p>
        time_in_force:
          type: string
          enum:
            - GTC
            - IOC
            - FOK
          default: GTC
          description: |
            Time in force:
            - GTC: Good Till Cancel
            - IOC: Immediate Or Cancel
            - FOK: Fill Or Kill
          example: GTC
          x-gitbook-description-html: |-
            <p>Time in force:</p>
            <ul>
            <li>GTC: Good Till Cancel</li>
            <li>IOC: Immediate Or Cancel</li>
            <li>FOK: Fill Or Kill</li>
            </ul>
        working_type:
          type: string
          enum:
            - mark_price
            - contract_price
          default: mark_price
          description: Price type for trigger evaluation
          x-gitbook-description-html: <p>Price type for trigger evaluation</p>
        post_only:
          type: boolean
          default: false
          description: If true, order will only be maker
          x-gitbook-description-html: <p>If true, order will only be maker</p>
        reduce_only:
          type: boolean
          default: false
          description: If true, order can only reduce position
          x-gitbook-description-html: <p>If true, order can only reduce position</p>
        close_position:
          type: boolean
          default: false
          description: If true, closes entire position when triggered
          x-gitbook-description-html: <p>If true, closes entire position when triggered</p>
        price_protect:
          type: boolean
          default: false
          description: If true, enables price protection
          x-gitbook-description-html: <p>If true, enables price protection</p>
        vault_id:
          type: string
          description: Optional vault ID to trade on behalf of a vault (leader only). Mutually exclusive with sub_account_id.
          example: vault-abc-123
          x-gitbook-description-html: <p>Optional vault ID to trade on behalf of a vault (leader only)</p>
        sub_account_id:
          type: string
          format: uuid
          description: Optional active subaccount owned by the authenticated master account. Mutually exclusive with vault_id.
          example: 019d1935-5bba-726e-a38e-838a892245f3
        callback_rate:
          type: string
          description: >-
            Trail distance as a percentage for trailing_stop_market orders.
            Range: "0.1" to "5". E.g. "1" = 1%.
          example: '5'
          x-gitbook-description-html: >-
            <p>Trail distance as a percentage for trailing_stop_market orders.
            Range: "0.1" to "5". E.g. "1" = 1%.</p>
        activation_price:
          type: string
          description: >-
            Price at which trailing begins. Only for trailing_stop_market
            orders. If omitted, trailing activates immediately at current
            working price.
          example: '67000'
          x-gitbook-description-html: >-
            <p>Price at which trailing begins. Only for trailing_stop_market
            orders. If omitted, trailing activates immediately at current
            working price.</p>
        slippage:
          type: string
          description: >-
            Slippage tolerance as a decimal fraction. Only for MARKET orders.
            E.g. "0.05" = 5%. Clamped to the market's maximum price bound. If
            omitted, the market default bound is used.
          example: '0.05'
          x-gitbook-description-html: >-
            <p>Slippage tolerance as a decimal fraction. Only for MARKET orders.
            E.g. "0.05" = 5%. Clamped to the market's maximum price bound. If
            omitted, the market default bound is used.</p>
    CreateOrderResponse:
      type: object
      properties:
        client_order_id:
          type: string
          description: Client-provided order ID
          example: my-order-001
          x-gitbook-description-html: <p>Client-provided order ID</p>
        account_id:
          type: string
          description: Account ID
          example: 01234567-89ab-cdef-0123-456789abcdef
