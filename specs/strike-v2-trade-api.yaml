paths:
  /v2/sub-accounts:
    get:
      tags:
        - Subaccounts
      summary: List subaccounts
      description: Lists the authenticated master account's pending and active subaccounts, including current equity, available balance, PnL, and margin-used percentage. Use an active account_id from this response as sub_account_id on supported trading and read endpoints.
      responses:
        '200':
          description: Subaccounts owned by the authenticated master account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubAccountsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v2/order:
    post:
      tags:
        - Orders
      summary: Create new order
      description: >
        Create a new order. Supports the following order types:


        | Type | Description |

        |------|-------------|

        | `limit` | Limit order at specified price |

        | `market` | Market order at best available price |

        | `stop` | Stop market order triggered at stop_price |

        | `stop_limit` | Stop limit order triggered at stop_price |

        | `take_profit` | Take profit market order |

        | `take_profit_limit` | Take profit limit order |

        | `trailing_stop_market` | Trailing stop market order that tracks price
        movement |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              limit_order:
                summary: Limit buy order
                value:
                  symbol: BTC-USD
                  side: buy
                  type: limit
                  size: '0.1'
                  price: '50000.00'
                  time_in_force: GTC
              subaccount_limit_order:
                summary: Limit buy order for an owned subaccount
                value:
                  sub_account_id: 019d1935-5bba-726e-a38e-838a892245f3
                  client_order_id: subaccount-order-001
                  symbol: BTC-USD
