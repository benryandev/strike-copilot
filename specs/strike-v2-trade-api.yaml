  /v2/order/replace-batch:
    post:
      tags:
        - Orders
      summary: Replace batch orders
      description: >
        Replace multiple orders in a single atomic engine command. Each
        replacement entry may include a cancel leg, a create leg, or both. All
        entries must target the same symbol. Cancels execute first, then creates
        run sequentially against post-cancel state. If a create fails at runtime
        (other than conditional trigger-immediate), remaining creates are
        halted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceBatchOrdersRequest'
            examples:
              replace_batch:
                summary: Replace multiple limit orders (cancel + create pairs)
                value:
                  replacements:
                    - cancel:
                        order_id: 123456
                        symbol: BTC-USD
                      new_order:
                        symbol: BTC-USD
                        side: buy
                        type: limit
                        size: '0.1'
                        price: '49500.00'
                    - cancel:
                        order_id: 123457
                        symbol: BTC-USD
                      new_order:
                        symbol: BTC-USD
                        side: sell
                        type: limit
                        size: '0.1'
                        price: '51500.00'
              mixed_legs:
                summary: Mix of cancel-only and create-only entries
                value:
                  replacements:
                    - cancel:
                        order_id: 123456
                        symbol: BTC-USD
                    - new_order:
                        symbol: BTC-USD
                        side: buy
                        type: limit
                        size: '0.1'
                        price: '49500.00'
      responses:
        '200':
          description: Batch replacement complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceBatchOrdersResponse'
          x-gitbook-description-html: <p>Batch replacement complete</p>
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '401':
          $ref: '#/components/responses/Unauthorized'
