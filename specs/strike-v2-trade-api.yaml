    post:
      tags:
        - Algo
      summary: Create TWAP strategy
      description: >
        Create a new TWAP (Time-Weighted Average Price) strategy. The strategy
        splits a large order into smaller slices executed at regular intervals
        over the specified duration.


        **Constraints:**

        - `duration_sec`: 300 (5 min) to 86400 (24 hr)

        - `total_size`: must exceed the market's minimum order size

        - Per-slice size must exceed the market's minimum order size

        - Maximum 20 concurrent non-terminal strategies per account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTwapRequest'
            examples:
              basic_twap:
                summary: Basic BUY TWAP over 1 hour
                value:
                  symbol: BTC-USDT
                  side: BUY
                  total_size: '1.5'
                  duration_sec: 3600
              twap_with_limit:
                summary: TWAP with limit price and jitter
                value:
                  symbol: BTC-USDT
                  side: BUY
                  total_size: '1.5'
                  duration_sec: 3600
                  limit_price: '45000.00'
                  randomize: true
